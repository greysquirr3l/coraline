[book]
title = "Coraline Documentation"
authors = ["Nick Campbell"]
language = "en"
description = "Fast, local code intelligence for AI assistants"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/greysquirr3l/coraline"
edit-url-template = "https://github.com/greysquirr3l/coraline/edit/main/book/{path}"
additional-css = []
additional-js = []

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true

[output.html.print]
enable = true
