name: Auto-tag on release merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Manual path: lets a release be tagged without re-running CI, and is
  # the path to verify end-to-end before cutting a real release.
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to tag (a SHA or any ref on the default branch)"
        required: true

permissions:
  contents: read

jobs:
  tag:
    name: Push version tag if missing
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Tag pushing requires contents: write; everything else in this workflow
    # only needs read.
    permissions:
      contents: write
    steps:
      # The commit to tag comes from the event: the CI run's head for the
      # automatic path, the explicit input for the manual one.
      - name: Resolve the commit to tag
        id: resolve
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            sha="${DISPATCH_REF}"
          else
            sha="${RUN_SHA}"
          fi
          if [[ -z "${sha}" ]]; then
            echo "No commit to tag" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          # Don't persist GITHUB_TOKEN as a git credential. The checked-out
          # commit's Cargo.toml is later read by `cargo metadata`, which
          # doesn't execute build.rs — but a malicious build.rs would still
          # be able to push with the token if we kept it on disk.
          persist-credentials: false

      - name: Gate on release commit
        id: gate
        run: |
          msg="$(git log -1 --pretty=%s)"
          if [[ "$msg" == chore\(release\):* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read crate version
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "coraline") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        if: steps.gate.outputs.run == 'true'
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release and tag
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # Use gh release create instead of `git tag` + `git push`. The
          # checkout step above uses `persist-credentials: false` (OSSF
          # Scorecard Dangerous-Workflow fix), so a plain `git push` would
          # fail with `could not read Username for 'https://github.com'`.
          # `gh` re-authenticates from $GH_TOKEN for each subcommand, so
          # the credential-persistence setting doesn't matter here.
          #
          # `--generate-notes` pulls PR titles + author credits from the
          # merged commits between this tag and the previous one; release.yml
          # overwrites the body with the curated CHANGELOG excerpt later
          # via `gh release edit`.
          #
          # No `--verify-tag`: that flag aborts unless the tag already
          # exists, which is never true for a new release — `gh` creates
          # the tag at --target when it is missing.
          if gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "$SHA" \
              --generate-notes \
              --title "$TAG"; then
            echo "Created release $TAG"
            exit 0
          fi

          # If a manual release already exists (concurrent push), treat
          # that as success — release.yml will still run and attach the
          # binaries.
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG was created concurrently; continuing"
            exit 0
          fi
          echo "Failed to create release $TAG"
          exit 1

      - name: Tag already exists
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'true'
        run: |
          echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping"

      - name: Not a release commit
        if: steps.gate.outputs.run != 'true'
        run: |
          echo "Skipping auto-tag: head commit is not a release commit"
