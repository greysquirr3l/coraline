[resolver]
incompatible-rust-versions = "fallback"

[alias]
xtclippy = "clippy --workspace --all-targets -- -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -W clippy::perf -A clippy::module_name_repetitions -A clippy::must_use_candidate -A clippy::missing_errors_doc -A clippy::missing_panics_doc -A clippy::struct_excessive_bools -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::indexing_slicing -D clippy::cast_ptr_alignment -D clippy::suspicious -D warnings"

[target.'cfg(all())']
rustflags = [
  # ── warn groups ──────────────────────────────────────────────────────────
  "-W", "clippy::all",
  "-W", "clippy::pedantic",
  "-W", "clippy::nursery",
  "-W", "clippy::cargo",
  "-W", "clippy::perf",
  # ── intentional allow overrides ──────────────────────────────────────────
  # Module-name repetition is noisy in a multi-crate workspace using the
  # collapsed hex / DDD-Lite layout where types often share the crate prefix.
  "-A", "clippy::module_name_repetitions",
  # Marking every public fn #[must_use] is mechanical noise in API handlers.
  "-A", "clippy::must_use_candidate",
  # Doc comments on error/panic paths are aspirational; enforce separately.
  "-A", "clippy::missing_errors_doc",
  "-A", "clippy::missing_panics_doc",
  # Domain types legitimately use multiple booleans (e.g. feature flags).
  "-A", "clippy::struct_excessive_bools",
  # ── hard denies ──────────────────────────────────────────────────────────
  "-D", "clippy::unwrap_used",
  "-D", "clippy::expect_used",
  "-D", "clippy::panic",
  "-D", "clippy::indexing_slicing",
  "-D", "clippy::cast_ptr_alignment",
  "-D", "clippy::suspicious",
  "-D", "warnings",
]
